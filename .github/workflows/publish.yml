name: Publish to PyPI

on:
  push:
    tags:
    - 'v*'
  release:
    types: [ published ]
  workflow_dispatch:


jobs:
  test:
    # Nothing reaches PyPI without a green test run first.
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint
      run: ruff check .

    - name: Test
      run: pytest --cov --cov-report=term-missing

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # REQUIRED for trusted publishing

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Resolve the release version
      id: version
      run: |
        # A tag push carries the version in the tag itself (lota push v1.1.0
        # already wrote it into pyproject.toml; this keeps them in sync even
        # when the tag was created by hand). For workflow_dispatch there is no
        # tag, so the version already in pyproject.toml is used as is.
        if [ "${{ github.ref_type }}" = "tag" ]; then
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version = .*/version = \"$VERSION\"/" pyproject.toml
        else
          VERSION=$(grep -m 1 '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Releasing $VERSION"

    - name: Check whether the version is already on PyPI
      id: check_pypi
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        if curl -fsS "https://pypi.org/pypi/fias-public-api/${VERSION}/json" >/dev/null; then
          echo "exists=true" >> $GITHUB_OUTPUT
          echo "fias-public-api ${VERSION} is already on PyPI; nothing to upload"
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install UV
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Build package
      run: uv build

    - name: Publish to PyPI (Trusted Publishing)
      id: publish_trusted
      if: steps.check_pypi.outputs.exists == 'false'
      continue-on-error: true # falls through to the token fallback; the verify step is the real gate
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist/
        print-hash: true

    - name: Publish to PyPI via UV (API token fallback)
      if: |
        steps.check_pypi.outputs.exists == 'false' &&
        (steps.publish_trusted.outcome == 'failure' || steps.publish_trusted.outcome == 'cancelled')
      env:
        UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        if [ -z "$UV_PUBLISH_TOKEN" ]; then
          echo "::error::Trusted publishing failed and PYPI_API_TOKEN is not set, so nothing was uploaded"
          exit 1
        fi
        uv publish --token "$UV_PUBLISH_TOKEN"

    - name: Verify the release is on PyPI
      # The last word. A green run that published nothing is worse than a red
      # one: this is how 1.0.4 and 1.0.7 went missing without anyone noticing.
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        for attempt in 1 2 3 4 5; do
          if curl -fsS "https://pypi.org/pypi/fias-public-api/${VERSION}/json" >/dev/null; then
            echo "fias-public-api ${VERSION} is on PyPI"
            exit 0
          fi
          echo "Not visible on PyPI yet (attempt ${attempt}/5), waiting..."
          sleep 10
        done
        echo "::error::fias-public-api ${VERSION} was not published to PyPI"
        exit 1

    - name: Create GitHub Release
      if: github.event_name == 'push'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: Release v${{ steps.version.outputs.version }}
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
