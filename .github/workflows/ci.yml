name: CI

on:
  push:
    branches: [ main ]
  pull_request:


jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13" ]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint
      run: ruff check .

    - name: Test
      # The live FIAS API tests are excluded by default (marker: integration),
      # so this job needs no network access and cannot fail on a flaky service.
      # Coverage settings live in pyproject.toml, including the fail_under gate.
      run: pytest --cov --cov-report=term-missing
